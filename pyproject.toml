[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grandma2-toolkit"
version = "0.1.1"
description = "Telnet, CLI, MCP and agent skill for grandMA2 onPC"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["mcp>=1.20,<2", "pillow>=11.2,<13; sys_platform == 'win32'"]

[project.scripts]
grandma2 = "grandma2_toolkit.cli:main"
grandma2-mcp = "grandma2_toolkit.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/grandma2_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
